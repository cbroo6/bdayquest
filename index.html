<style>
:root {
  --bg: #eef1ea; --surface: #ffffff; --ink: #1d2a33; --muted: #5b6a70; --line: #cfd8cc;
  --accent: #2f6b4f; --accent-ink: #ffffff; --mark: #f3c843; --bad: #b3362f; --bad-bg: #f8e3e1; --ok-bg: #e3f1e7;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121a17; --surface: #1b2622; --ink: #e6ede8; --muted: #9aaba3; --line: #2f3e37;
  --accent: #6fbf94; --accent-ink: #0d1a14; --mark: #e2bb44; --bad: #f08a80; --bad-bg: #3a1f1c; --ok-bg: #1d3327;
  color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-family: "Sigmar", "Arial Black", Impact, sans-serif; font-weight: 400; font-size: 2.2rem; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.label { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stub { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; border-bottom: 2px dashed var(--line); }
.stop { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--mark); color: #1d2a33; padding: 2px 8px; border-radius: 3px; }
.body { padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.clue { font-family: "DM Serif Display", Georgia, "Times New Roman", serif; font-size: 1.5rem; font-weight: 400; line-height: 1.3; white-space: pre-wrap; }
.welcome { white-space: pre-wrap; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 0.95rem; }
.steps li::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line);
  display: grid; place-items: center; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
form { display: flex; gap: 8px; flex-wrap: wrap; }
input { flex: 1 1 160px; min-width: 0; font: inherit; font-family: var(--mono); font-size: 1.05rem; letter-spacing: 0.08em; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
button { font: inherit; font-weight: 700; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 10px 18px; cursor: pointer; min-height: 46px; }
button:disabled { opacity: 0.6; cursor: wait; }
button.link { background: none; border: none; color: var(--muted); font-weight: 400; text-decoration: underline; padding: 4px 0; min-height: 0; font-size: 0.85rem; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.msg { border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; }
.msg.bad { background: var(--bad-bg); color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--accent); }
.progress { display: flex; flex-direction: column; gap: 6px; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 8px; border-radius: 2px; background: var(--line); }
.segs i.done { background: var(--accent); }
.segs i.here { background: var(--mark); }
.found { display: flex; flex-direction: column; gap: 6px; }
.found div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
.found b { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); padding-top: 2px; }
.finish { text-align: center; padding: 30px 18px; display: flex; flex-direction: column; gap: 12px; }
.finish .big { font-family: var(--display); font-size: 2.2rem; font-weight: 800; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
footer { text-align: center; }
button.hintbtn { background: none; color: var(--accent); border: 1px dashed var(--accent); align-self: flex-start; min-height: 40px; padding: 8px 14px; }
.hint { background: var(--bg); border-left: 4px solid var(--mark); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; font-size: 0.95rem; }
.hint b { display: block; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
:root { --bg: #edf1f7; --surface: #ffffff; --line: #d0d5dc; --accent: #1f4e8c; --accent-ink: #ffffff; --mark: #f6b8c8; --ok-bg: #e0e6ef; }
@media (prefers-color-scheme: dark) { :root { --bg: #10161e; --surface: #111b28; --line: #132439; --accent: #8fa7c6; --accent-ink: #ffffff; --mark: #f6b8c8; --ok-bg: #2a313a; } }
</style>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('hunt-data').textContent);
  const app = document.getElementById('app');
  const KEY = 'clue-hunt-' + DATA.start.s.slice(0, 16);
  const te = new TextEncoder(), td = new TextDecoder();
  const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/gi, '').toUpperCase();
  async function open(secret, box) {
    const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub64(box.s), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(box.i) }, key, ub64(box.c))));
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function form(placeholder, label, onSubmit) {
    const f = el('form'); const input = el('input'); input.placeholder = placeholder; input.setAttribute('aria-label', label);
    input.autocomplete = 'off'; input.setAttribute('autocapitalize', 'characters'); input.spellcheck = false;
    const b = el('button', null, 'Unlock'); b.type = 'submit'; f.append(input, b);
    f.addEventListener('submit', async (e) => {
      e.preventDefault(); if (!norm(input.value)) { input.focus(); return; }
      b.disabled = true; b.textContent = 'Checking…';
      const ok = await onSubmit(input.value);
      if (!ok) { b.disabled = false; b.textContent = 'Unlock'; }
    });
    return { f, input };
  }
  function fail(card, box, text) {
    let m = box.querySelector('.msg.bad'); if (!m) { m = el('div', 'msg bad'); box.append(m); }
    m.textContent = text; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }

  function render() {
    app.replaceChildren();
    if (!crypto || !crypto.subtle) { app.append(el('p', null, "This page can't unlock clues here. Open it from its web address (https://…) in Safari or Chrome.")); return; }
    if (!S || !S.start) return renderLock();
    const n = DATA.n, step = S.found.length;
    const head = el('header'); head.style.cssText = 'display:flex;flex-direction:column;gap:4px';
    head.append(el('span', 'label', 'Scavenger hunt'), el('h1', null, S.start.title || DATA.title));
    app.append(head);

    const prog = el('div', 'progress'); const segs = el('div', 'segs');
    for (let i = 0; i < n; i++) segs.append(el('i', i < step ? 'done' : i === step ? 'here' : ''));
    prog.append(el('span', 'label', step >= n ? `All ${n} stops found` : `${step} of ${n} found`), segs);
    app.append(prog);

    if (step >= n) {
      const fin = el('section', 'card finish');
      fin.append(el('span', 'big', 'You did it!'), el('p', 'welcome', S.found[n - 1].final || `You found all ${n} stops.`));
      app.append(fin);
    } else {
      const card = el('article', 'card');
      const stub = el('div', 'stub'); stub.append(el('span', 'stop', `Stop ${step + 1} of ${n}`), el('span', 'label', 'Your clue'));
      const body = el('div', 'body');
      if (step === 0 && S.start.welcome) body.append(el('p', 'welcome', S.start.welcome));
      if (step > 0) body.append(el('div', 'msg ok', `Correct! You found ${S.found[step - 1].found}.`));
      body.append(el('p', 'clue', step === 0 ? S.start.clue : S.found[step - 1].next));
      const hint = step === 0 ? S.start.hint : S.found[step - 1].nextHint;
      if (hint) {
        S.hints = S.hints || {};
        const showHint = () => { const h = el('div', 'hint'); h.append(el('b', null, 'Hint'), document.createTextNode(hint)); return h; };
        if (S.hints[step]) body.append(showHint());
        else {
          const hb = el('button', 'hintbtn', 'Get a hint'); hb.type = 'button';
          hb.addEventListener('click', () => { S.hints[step] = true; save(); hb.replaceWith(showHint()); });
          body.append(hb);
        }
      }
      const who = S.start.from || 'me';
      const lines = Array.isArray(S.start.steps) ? S.start.steps : ['Go to the place the clue describes.', `Take a photo there and text it to ${who}.`, `Type the code ${who} sends back.`];
      if (lines.length) { const steps = el('ol', 'steps'); lines.forEach((t) => steps.append(el('li', null, t))); body.append(steps); }
      const { f, input } = form('Unlock code', 'Unlock code', async (val) => {
        try {
          const r = await open(S.pw + '\u0000' + norm(val), DATA.steps[step]);
          S.found.push(r); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return true;
        } catch (e) { fail(card, body, `That code doesn't match. Check the text from ${who} and try again.`); input.select(); return false; }
      });
      body.append(f);
      card.append(stub, body); app.append(card);
    }
    if (step > 0) {
      const list = el('section', 'found'); list.append(el('span', 'label', 'Found so far'));
      S.found.forEach((r, i) => { const row = el('div'); row.append(el('b', null, String(i + 1)), el('span', null, r.found)); list.append(row); });
      app.append(list);
    }
    const foot = el('footer'); const reset = el('button', 'link', 'Start over on this phone'); let armed = false;
    reset.addEventListener('click', () => {
      if (!armed) { armed = true; reset.textContent = 'Tap again to erase your progress'; return; }
      S = null; try { localStorage.removeItem(KEY); } catch (e) {} render();
    });
    foot.append(reset); app.append(foot);
  }

  function renderLock() {
    const head = el('header'); head.style.cssText = 'display:flex;flex-direction:column;gap:4px';
    head.append(el('span', 'label', 'Scavenger hunt'), el('h1', null, DATA.title));
    const card = el('section', 'card'); const body = el('div', 'body');
    body.append(el('p', 'welcome', DATA.lockText || 'Enter the password to start.'));
    const { f, input } = form('Password', 'Password', async (val) => {
      try {
        const start = await open(norm(val), DATA.start);
        S = { pw: norm(val), start, found: [] }; save(); render(); return true;
      } catch (e) { fail(card, body, "That password isn't right."); input.select(); return false; }
    });
    body.append(f); card.append(body); app.append(head, card);
    input.focus();
  }
  render();
})();
</script>
